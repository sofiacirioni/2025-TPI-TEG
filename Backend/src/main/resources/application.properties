##### BASE DE DATOS — PostgreSQL (único motor, dev y prod) #####
# Los defaults apuntan al Postgres que levanta docker-compose y publica en
# localhost:5432, para poder correr el backend fuera de Docker (npm start)
# contra la misma base. En Docker, compose sobreescribe DB_URL por el host
# interno de la red ("postgres").
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tegdb}
spring.datasource.username=${DB_USER:teg}
spring.datasource.password=${DB_PASSWORD:teg}
spring.datasource.driver-class-name=org.postgresql.Driver

##### Connection pool (HikariCP) #####
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

##### JPA / Hibernate #####
# El esquema lo gobierna Flyway. `validate` verifica que las entidades
# coincidan con las tablas y falla al arrancar si divergen — nunca las
# modifica. Todo cambio de entidad requiere una migración nueva.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

##### Flyway — migraciones de esquema y datos semilla #####
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8
# Permite adoptar una base que ya tenga tablas creadas por Hibernate.
spring.flyway.baseline-on-migrate=true

##### SPRING DOC PROPERTIES #####
springdoc.show-actuator=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

##### Servidor #####
server.port=${SERVER_PORT:8080}

##### CORS #####
# Coma-separado. En Docker el frontend se sirve desde Nginx en el puerto 80.
cors.allowed-origins=${FRONTEND_URL:http://localhost:4200,http://localhost}

##### JWT #####
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

##### Cookie #####
# false en dev (HTTP), true en prod (HTTPS).
cookie.secure=${COOKIE_SECURE:false}

##### Logging #####
logging.level.root=${LOG_LEVEL:WARN}

##### Metadatos de la aplicación (SpringDoc) #####
app.name=TEG
app.desc=TEG Game API
app.version=1.0.0
app.url=http://localhost:8080
app.dev-name=Group 8
app.dev-email=contact@group8.com
