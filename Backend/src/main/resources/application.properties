# Perfil activo por defecto — sobreescribir con variable de entorno
# SPRING_PROFILES_ACTIVE=prod en producción
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

##### SPRING DOC PROPERTIES #####
springdoc.show-actuator=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

##### JPA — configuración común #####
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

##### Servidor #####
server.port=${SERVER_PORT:8080}

##### Metadatos de la aplicación (SpringDoc) #####
app.name=TEG
app.desc=TEG Game API
app.version=1.0.0
app.url=http://localhost:8080
app.dev-name=Group 8
app.dev-email=contact@group8.com
