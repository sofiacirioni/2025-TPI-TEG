# ── Perfil: desarrollo local (H2 en archivo) ──────────────────────────────────

##### SPRING DATA SOURCE (H2 persistente) #####
spring.datasource.url=jdbc:h2:file:./data/tegdb;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=100000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

##### H2 Console #####
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

##### JPA / Hibernate #####
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

##### Inicialización de la base de datos #####
spring.sql.init.mode=never
spring.sql.init.platform=h2

##### JWT (solo dev — en prod viene de variable de entorno) #####
jwt.secret=ZGV2LXNlY3JldC1rZXktbWluaW1vLTMyLWNoYXJhY3RlcmVz

##### Logging #####
logging.level.root=WARN
