# ── Perfil: producción (PostgreSQL) ───────────────────────────────────────────

##### SPRING DATA SOURCE (PostgreSQL) #####
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

##### JPA / Hibernate #####
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate — nunca modificar el esquema automáticamente en producción.
# En el primer despliegue usar update y luego volver a validate.
spring.jpa.hibernate.ddl-auto=validate

##### H2 Console — deshabilitada en producción #####
spring.h2.console.enabled=false

##### Connection pool (HikariCP) #####
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

##### CORS #####
cors.allowed-origins=${FRONTEND_URL}

##### Logging #####
logging.level.root=WARN
