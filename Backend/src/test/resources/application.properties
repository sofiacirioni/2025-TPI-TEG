##### Application properties #####
app.name=TEG-grupo8
app.desc=TEG project for Spring Boot
app.version=0.0.1-SNAPSHOT
app.url=http://localhost:8080
app.dev-name=John Doe
app.dev-email=dumy@dumy

##### SPRING DOC PROPERTIES #####
springdoc.show-actuator=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

##### Base de datos — H2 en memoria, solo para tests #####
# La app corre siempre sobre PostgreSQL; H2 existe únicamente acá para que
# `mvnw test` no dependa de un Postgres levantado.
# IMPORTANTE: en memoria, NO en archivo. Antes apuntaba a ./data/tegdb con
# ddl-auto=create, así que correr los tests borraba la base de desarrollo.
spring.datasource.url=jdbc:h2:mem:tegdb-test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

##### JPA / Hibernate #####
# El esquema de los tests lo arma Hibernate desde las entidades.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

##### Inicialización por script — apagada #####
# Ya no existe data.sql: los datos semilla viven en las migraciones de Flyway.
# Explícito porque el default (`embedded`) ejecutaría cualquier data.sql que
# quedara en el classpath contra H2.
spring.sql.init.mode=never

##### Flyway — apagado en tests #####
# Las migraciones son específicas de PostgreSQL (pg_get_serial_sequence, ...)
# y no corren en H2.
spring.flyway.enabled=false

##### JWT #####
# Los tests de contexto (@SpringBootTest) fallaban porque este archivo pisa
# al de main y no definía ninguna de las tres propiedades que necesita
# JwtService. El secreto se usa como bytes crudos: 64 chars => HS512.
jwt.secret=dGVzdC1zZWNyZXQta2V5LXBhcmEtdGVzdHMtc29sby02NC1jaGFyYWN0ZXJlcw==
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

##### Logging y servidor #####
server.port=8080
logging.level.root=WARN
