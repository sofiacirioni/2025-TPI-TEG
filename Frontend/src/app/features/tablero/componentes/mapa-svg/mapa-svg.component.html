<svg id="mapa" width="1200"
     height="675"
     viewBox="0 0 1920 1080"
     class="border border-2 border-dark rounded bg-primary-subtle shadow-lg">
  @for (p of mapaPais; track $index) {
    <path
      [attr.d]="p.forma"
      [attr.fill]="p.color"
      [attr.stroke]="'white'"
      [attr.stroke-width]="0.5"
      [attr.opacity]="p.opacidad"
      (click)="clickPais(p.id)"
      (mouseenter)="p.opacidad = 1"
      (mouseleave)="p.opacidad = 0.8"
    >
    </path>
  }
</svg>
