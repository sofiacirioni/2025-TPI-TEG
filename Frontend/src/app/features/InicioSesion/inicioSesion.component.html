<section class="login-wrapper">
  <div class="login-card">
    <h2>Iniciar Sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nombreUsuario">Usuario</label>
        <input id="nombreUsuario" type="text" formControlName="nombreUsuario" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="contrasenia">Contraseña</label>
        <input id="contrasenia" type="password" formControlName="contrasenia" autocomplete="current-password">
      </div>

      <button type="submit" class="button" [disabled]="loginForm.invalid">Entrar</button>

      <p class="register-link">
        ¿No tienes cuenta? <a [routerLink]="['../registrarse']">Regístrate</a>
      </p>
    </form>
  </div>
</section>
