<meta charset="UTF-8" />
<title>Registrarse</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
  rel="stylesheet" />

<!-- Estilos -->
<link rel="stylesheet" href="./registrarse.css" />

<body>
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <!-- Formulario de Registro -->
    <section class="p-4 d-flex flex-column">
      <form #f="ngForm" (ngSubmit)="f.form.valid && onSubmit()" novalidate>
        <h2 class="form-title">Registrarse</h2>

        <!-- Nombre -->
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" [(ngModel)]="usuario.nombre" name="nombre" required #nombre="ngModel"
          [class.is-invalid]="nombre.invalid && (nombre.dirty || nombre.touched)">
        <div class="error-msg">
          <span *ngIf="nombre.errors?.['required'] && (nombre.dirty || nombre.touched)">
            El nombre es obligatorio.
          </span>
        </div>

        <!-- Apellido -->
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" [(ngModel)]="usuario.apellido" name="apellido" required #apellido="ngModel"
          [class.is-invalid]="apellido.invalid && (apellido.dirty || apellido.touched)">
        <div class="error-msg">
          <span *ngIf="apellido.errors?.['required'] && (apellido.dirty || apellido.touched)">
            El apellido es obligatorio.
          </span>
        </div>

        <!-- Correo -->
        <label for="email">Correo</label>
        <input type="email" id="email" [(ngModel)]="usuario.correo" name="email" required email #email="ngModel"
          [class.is-invalid]="email.invalid && (email.dirty || email.touched)">
        <div class="error-msg">
          <span *ngIf="email.errors?.['required'] && (email.dirty || email.touched)">
            El correo es obligatorio.
          </span>
          <span *ngIf="email.errors?.['email'] && (email.dirty || email.touched)">
            Formato de correo inválido.
          </span>
        </div>

        <!-- Contraseña -->
        <label for="contrasenia">Contraseña</label>
        <input type="password" id="contrasenia" [(ngModel)]="usuario.contrasenia" name="contrasenia" required
          minlength="8" pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%?&])[A-Za-z\d@$!%?&]{8,}$" #pass="ngModel"
          [class.is-invalid]="pass.invalid && (pass.dirty || pass.touched)">
        <div class="error-msg">
          <span *ngIf="pass.errors?.['required'] && (pass.dirty || pass.touched)">
            La contraseña es obligatoria.
          </span>
          <span *ngIf="pass.errors?.['minlength'] && (pass.dirty || pass.touched)">
            Mínimo 8 caracteres.
          </span>
          <span *ngIf="pass.errors?.['pattern'] && (pass.dirty || pass.touched)">
            Debe tener 1 mayúscula, 1 minúscula, 1 número y 1 carácter especial (@$!%?&).
          </span>
        </div>

        <!-- Galería -->
        <button type="button" class="button button-alt mb-2"
          style="background:transparent; color: var(--text-primary); border-color: var(--text-primary)"
          (click)="toggleGaleria()">
          Seleccionar Imagen
        </button>

        <div class="dropdown-galeria" *ngIf="mostrarGaleria">
          <div class="galeria-imagenes">
            <img *ngFor="let img of imagen" [src]="img" [class.seleccionada]="imagenSeleccionadaTemporal === img"
              (click)="seleccionarImagen(img)" alt="Avatar" width="50" height="50" />
          </div>
        </div>

        <div *ngIf="usuario.imagen" class="mt-2 text-center">
          <img [src]="usuario.imagen" alt="Avatar seleccionado" width="80" height="80"
            style="border-radius: 50%; border: 3px solid var(--accent-red); box-shadow: var(--shadow-paper);">
        </div>

        <button type="submit" class="button mt-3" [disabled]="f.invalid">Registrarse</button>

        <p class="mt-3" style="font-family: var(--font-body); font-size: 0.9rem;">
          ¿Ya tienes una cuenta?
          <a [routerLink]="['/iniciar-sesion']" style="color: var(--accent-blue); font-weight: bold;">Iniciar Sesión</a>
        </p>
      </form>
    </section>
  </div>
  <a [routerLink]="['../principal']" id="volver"></a>

</body>
