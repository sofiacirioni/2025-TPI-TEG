
  <title>Sala de Espera</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Montserrat:ital,wght@0,900;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

<body>
<div class="wrapper container mt-5" *ngIf="sala">
  <h2>SALA DE ESPERA - {{ sala.nombreSala }}</h2>
  <p class="subtexto">Espere a que otros jugadores se unan y comience la partida...</p>
  <p class="url">¡INVITA A TUS AMIGOS! -{{sala.url}}</p>
  <!-- Botón para abrir el modal -->
  <button class="btn btn-primary mb-3" (click)="abrirModal()">Elige tu nombre</button>

  <!-- Modal de creación -->
  <div
    class="modal fade show"
    tabindex="-1"
    style="display: block;"
    *ngIf="mostrarModal"
    (click)="cerrarModal($event)"
  >
    <div class="modal-dialog" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Crear Jugador</h5>
          <button type="button" class="btn-close" aria-label="Cerrar" (click)="cerrarModal($event)"></button>
        </div>

        <form *ngIf="crearJugadorForm" [formGroup]="crearJugadorForm" (ngSubmit)="crearJugador()">
          <div class="modal-body">
            <div class="form-row d-flex align-items-center gap-3">
              <label for="nombreJugador" class="form-label mb-0">Jugador:</label>
              <input id="nombreJugador" formControlName="nombreJugador" class="form-control" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-success" (click)="crearJugador()">OK</button>

          </div>

        </form>
      </div>
    </div>
  </div>

  <!-- Lista de jugadores -->
  <div class="caja-jugadores mt-4">
    <div class="titulo-jugadores">JUGADORES</div>

    <div class="jugador" *ngFor="let jugador of jugadores">
      <span>{{ jugador.nombreJugador }}</span>
    </div>
    <button class="btn btn-primary mb-3" *ngIf="esUsuarioCreador()" (click)="crearBot()">Crear Bot</button>


  </div>

  <!-- Botón para iniciar partida -->
  <button type="button" class="partida" (click)="crearPartida()">Iniciar partida</button>
</div>

<!-- Botones de navegación -->
<a [routerLink]="['../ayuda']" id="ayuda" class="btn btn-info position-fixed bottom-0 start-0 m-3">Ayuda</a>
<a [routerLink]="['../principal']" id="volver" ></a>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
