<svg id="mapa"
     width="100%"
     height="100%"
     viewBox="0 0 1920 1080"
     class="mapa-svg">

  <!--
    CAPA 1: Fondo papel (color-claro) + tinta oceánica (color-mar con opacidad reducida).
    El color del mar se aplica con baja opacidad para que el fondo de papel prevalezca.
  -->
  <rect width="1920" height="1080" style="fill:var(--color-claro)"/>
  <rect width="1920" height="1080" style="fill:var(--color-mar)" fill-opacity="0.30"/>

  <!--
    CAPA 2: Rellenos RGBA dinámicos por jugador (~0.4 opacidad).
    Países sin dueño reciben un tinte sutil del continente para distinguir regiones.
    Estos paths capturan los eventos de click y hover.
  -->
  @for (p of mapaPais; track p.id) {
    @if (p.forma) {
      <path
        [attr.d]="p.forma"
        [attr.fill]="p.color"
        stroke="none"
        [style.filter]="p.opacidad > 1 ? 'brightness(1.3)' : 'none'"
        style="cursor: pointer; transition: filter 0.15s ease;"
        (click)="clickPais(p.id, $event)"
        (mouseenter)="p.opacidad = 1.15"
        (mouseleave)="p.opacidad = 1"
      />
    }
  }

  <!--
    CAPA 2b: Bordes de continente.
    Stroke fino en el color del continente (opacidad ~0.55) para distinguir
    visualmente cada región del mapa. Se renderiza sobre los rellenos pero
    debajo del SVG estático, de modo que las etiquetas y decoraciones siempre
    queden encima.
  -->
  @for (p of mapaPais; track p.id) {
    @if (p.forma) {
      <path
        [attr.d]="p.forma"
        fill="none"
        [attr.stroke]="p.colorBorde"
        stroke-width="1.2"
        pointer-events="none"
      />
    }
  }

  <!--
    CAPA 3: SVG original como imagen estática.
    Renderiza con todos sus estilos, capas y decoraciones originales:
    decoraciones (sol, brújula, barcos, logos), bordes de países con
    color-oscuro (#432A1E), etiquetas de nombres.
    pointer-events:none permite que los clicks pasen a la capa 2.
  -->
  <image
    [attr.href]="svgAssetUrl"
    x="0" y="0"
    width="1920" height="1080"
    style="pointer-events:none"
  />

  <!--
    CAPA 4: Fichas de tropas (encima de todo).
    Círculo de color sólido del jugador + número de tropas en Special Elite.
  -->
  @for (p of mapaPais; track p.id) {
    @if (p.cx > 0 && p.cy > 0 && p.tropas > 0) {
      <!-- Sombra -->
      <circle
        [attr.cx]="p.cx + 1"
        [attr.cy]="p.cy + 1"
        r="12"
        fill="rgba(0,0,0,0.4)"
        pointer-events="none"
      />
      <!-- Círculo de color del jugador -->
      <circle
        [attr.cx]="p.cx"
        [attr.cy]="p.cy"
        r="12"
        [attr.fill]="p.colorSolido"
        stroke="rgba(239,232,206,0.85)"
        stroke-width="1.5"
        pointer-events="none"
      />
      <!-- Cantidad de tropas -->
      <text
        [attr.x]="p.cx"
        [attr.y]="p.cy + 4"
        text-anchor="middle"
        font-family="'Special Elite', serif"
        font-size="11"
        font-weight="700"
        fill="#EFE8CE"
        pointer-events="none"
      >{{ p.tropas }}</text>
    }
  }
</svg>
