

<div class="d-flex align-items-center rounded shadow-sm p-3 mb-3 border border-2 player-card"
     [ngStyle]="{'background-color': obtenerColor(jugador.color)}">

  <!-- Avatar del jugador -->
  <div class="rounded bg-light border border-white me-3 d-flex justify-content-center align-items-center"
       style="width: 70px; height: 70px; overflow: hidden; ">

    <img [src]="obtenerAvatar(jugador.idJugador)"  width="50" height="50" alt="avatar" />


  </div>

  <!-- Información del jugador -->
  <div class="flex-grow-1">
    <div class="text-white fw-bold fs-3 mb-1">{{ jugador.nombre }}</div>
    <div class="text-white-50 small">
      <span class="badge rounded-pill"
            [ngStyle]="{'background-color': obtenerColor(jugador.color)}">
        {{ jugador.color }}
      </span>
    </div>
    <div class="text-white-50 small mt-1">
      {{ jugador.ejercito ?? 0 }} ej.
      @if ((jugador.cantidadTarjetas ?? 0) > 0) {
        &nbsp;· {{ jugador.cantidadTarjetas }} 🃏
      }
    </div>
  </div>

  <!-- Indicador de color (opcional) -->
  <div class="rounded-circle border border-white ms-2"
       style="width: 16px; height: 16px;"
       [ngStyle]="{'background-color': obtenerColor(jugador.color)}">
  </div>
</div>
