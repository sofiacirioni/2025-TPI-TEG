<div class="Container" [class.ui-fading]="uiFading">

  <!-- Fondo war-room en capa separada para zoom independiente -->
  <div class="bg-scene" [class.bg-scene--zooming]="bgZooming"></div>

  <!-- Perfil (esquina superior derecha) -->
  <button class="nav-icon-btn btn-perfil" (click)="verificarUsuario()" title="Perfil">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
      <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
      <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
    </svg>
  </button>

  <!-- Panel UI centrado en la parte inferior -->
  <div class="ui-panel">
    <h1 class="teg-display teg-title">T · E · G</h1>
    <p class="teg-caption teg-subtitle">Táctica y Estrategia de Guerra</p>
    <button class="btn-teg-dark jugar-btn" (click)="onJugar()">· JUGAR ·</button>
  </div>

  <!-- Créditos (esquina inferior izquierda) -->
  <button class="nav-icon-btn nav-icon-btn--label btn-creditos" (click)="RedireccionarCreditos()">
    Créditos
  </button>

  <!-- Ayuda (esquina inferior derecha) -->
  <button class="nav-icon-btn btn-ayuda" (click)="RedireccionarAyuda()" title="Ayuda">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
      <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M5.496 6.033h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286a.237.237 0 0 0 .241.247m2.325 6.443c.61 0 1.029-.394 1.029-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94 0 .533.425.927 1.01.927z"/>
    </svg>
  </button>

  <!-- Partículas de polvo -->
  <canvas #particleCanvas class="particle-canvas"></canvas>

  <!-- Overlay oscuro durante la transición -->
  <div class="bg-dark-overlay" [class.bg-dark-overlay--active]="darkening"></div>

  <!-- Crossfade a la siguiente escena -->
  <div class="overlay-zoom" [class.overlay-zoom--active]="zoomActive"></div>
</div>
