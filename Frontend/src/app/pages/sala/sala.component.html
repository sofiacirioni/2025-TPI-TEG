<head>
  <!-- Fuentes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Montserrat:ital,wght@0,900;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet"
  />
  <title>Elige una opción:</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
<div class="container my-4">

  <!-- Botones principales -->
  <div class="mb-3">
    <button class="unirseSala" (click)="abrirModalUnirse()">Unirse a una sala</button>
    <button class="crearSala" (click)="abrirModal()">Crear una sala</button>
    <button class="unirsePartida" (click)="abrirModalUnirsePartida()">Unirse a una partida</button>
  </div>

  <!-- Modal Unirse a Sala -->
  <div
    class="modal fade show"
    tabindex="-1"
    style="display: block;"
    *ngIf="mostrarModalUnirse"
    (click)="cerrarModal($event)"
  >
    <div class="modal-dialog" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Unirse a una sala</h5>
          <button type="button" class="btn-close" aria-label="Cerrar" (click)="cerrarModal($event)"></button>
        </div>
        <form [formGroup]="unirseSala" (ngSubmit)="onUnirseSala()">
          <div class="modal-body">
            <label for="url" class="form-label">URL de la sala</label>
            <input id="url" type="text" formControlName="url" class="form-control" />
            <div *ngIf="unirseSala.get('url')?.invalid" class="text-danger mt-1">
              El nombre es obligatorio
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Unirse</button>
            <button type="button" class="btn btn-secondary" (click)="cerrarModal($event)">Cerrar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Crear Sala -->
  <div
    class="modal fade show"
    tabindex="-1"
    style="display: block;"
    *ngIf="mostrarModal"
    (click)="cerrarModal($event)"
  >
    <div class="modal-dialog" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Crear una sala</h5>
          <button type="button" class="btn-close" aria-label="Cerrar" (click)="cerrarModal($event)"></button>
        </div>
        <form [formGroup]="crearSala" (ngSubmit)="onCrearSala()">
          <div class="modal-body">
            <label for="nombreSala" class="form-label">Nombre de la sala</label>
            <input id="nombreSala" type="text" formControlName="nombreSala" class="form-control" />
            <div *ngIf="crearSala.get('nombreSala')?.invalid" class="text-danger mt-1">
              El nombre es obligatorio
            </div>

          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Crear</button>
            <button type="button" class="btn btn-secondary" (click)="cerrarModal($event)">Cerrar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Unirse a Partida -->
  <div
    class="modal fade show"
    tabindex="-1"
    style="display: block;"
    *ngIf="mostrarModalUnirsePartida"
    (click)="cerrarModal($event)"
  >
    <div class="modal-dialog" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Unirse a una partida</h5>
          <button type="button" class="btn-close" aria-label="Cerrar" (click)="cerrarModal($event)"></button>
        </div>
        <form [formGroup]="unirsePartida" (ngSubmit)="onUnirsePartida()">
          <div class="modal-body">
            <label for="urlPartida" class="form-label">URL de la partida</label>
            <input id="urlPartida" type="text" formControlName="url" class="form-control" />
            <div *ngIf="unirsePartida.get('urlPartida')?.invalid" class="text-danger mt-1">
              La URL es obligatoria
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Unirse</button>
            <button type="button" class="btn btn-secondary" (click)="cerrarModal($event)">Cerrar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>

<!-- Botón de volver -->
<a [routerLink]="['../principal']" id="volver" aria-label="Volver a la pantalla principal"></a>

</body>
