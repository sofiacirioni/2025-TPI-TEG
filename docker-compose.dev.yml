version: '3.8'

# Override para desarrollo local — usar con:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# En desarrollo se recomienda directamente:
#   npm start   (desde la raíz del monorepo)
# Este archivo existe solo para desarrollo con Docker si se necesita.

services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"   # Exponer en dev para acceso directo
    volumes:
      - ./Backend/data:/app/data   # Persistir H2 en dev

  frontend:
    # En dev usar ng serve en lugar del build de producción.
    # Este override es solo de referencia —
    # en desarrollo seguir usando npm start desde la raíz.
